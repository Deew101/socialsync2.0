name: Keep Supabase Alive

# Runs every 5 days to prevent the free-tier project from auto-pausing.
# Supabase pauses projects after 7 days of inactivity on the free plan.
on:
  schedule:
    - cron: "0 8 */5 * *"   # every 5 days at 08:00 UTC
  workflow_dispatch:          # also allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase project (restore if paused)
        run: |
          STATUS=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
            "https://api.supabase.com/v1/projects/othnnqfkbprfdpartaqv" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','UNKNOWN'))")

          echo "Current project status: $STATUS"

          if [ "$STATUS" = "INACTIVE" ] || [ "$STATUS" = "PAUSING" ]; then
            echo "Project is paused — sending restore request..."
            curl -s -X POST \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{}' \
              "https://api.supabase.com/v1/projects/othnnqfkbprfdpartaqv/restore"
            echo "Restore request sent."
          else
            echo "Project is healthy ($STATUS) — no action needed."
          fi
