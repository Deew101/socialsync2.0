<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>SocialSync 2.0</title>
    <script type="text/javascript">
      // Redirect 404 subpath to socialsync2.0 hash route
      var path = window.location.pathname.replace(/^\/socialsync2\.0/, '');
      if (path && path !== '/') {
        window.location.replace('/socialsync2.0/#' + path + window.location.search);
      } else {
        window.location.replace('/socialsync2.0/#/');
      }
    </script>
  </head>
  <body>
  </body>
</html>
